name: Deploy Claude Manual to Cloudflare

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - preview/repair-cart-scion-dedupe-20261125
      - preview/scion-torque-sibling-fix-20261125
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and validate Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare local PDF receipt reader
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@4.10.38
          mkdir -p public/vendor/pdfjs
          cp node_modules/pdfjs-dist/legacy/build/pdf.mjs node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs public/vendor/pdfjs/
          cp node_modules/pdfjs-dist/LICENSE public/vendor/pdfjs/LICENSE

      - name: Run tests
        run: npm test

      - name: Validate Wrangler deployment bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy-check

  deploy:
    name: Deploy production Worker
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare local PDF receipt reader
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@4.10.38
          mkdir -p public/vendor/pdfjs
          cp node_modules/pdfjs-dist/legacy/build/pdf.mjs node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs public/vendor/pdfjs/
          cp node_modules/pdfjs-dist/LICENSE public/vendor/pdfjs/LICENSE

      - name: Deploy Worker, static assets, and R2 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.jsonc

  deploy-preview:
    name: Deploy isolated preview Worker
    needs: validate
    if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/preview/repair-cart-scion-dedupe-20261125' || github.ref == 'refs/heads/preview/scion-torque-sibling-fix-20261125')) || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'preview/repair-cart-scion-dedupe-20261125' || github.event.pull_request.head.ref == 'preview/scion-torque-sibling-fix-20261125'))
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare local PDF receipt reader
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@4.10.38
          mkdir -p public/vendor/pdfjs
          cp node_modules/pdfjs-dist/legacy/build/pdf.mjs node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs public/vendor/pdfjs/
          cp node_modules/pdfjs-dist/LICENSE public/vendor/pdfjs/LICENSE

      - name: Deploy isolated preview Worker for preview-branch push, dispatch, or pull request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$BRANCH" in
            preview/scion-torque-sibling-fix-20261125) ALIAS=preview-scion-torque-sibling-fix-20261125 ;;
            preview/repair-cart-scion-dedupe-20261125) ALIAS=preview-repair-cart-scion-dedupe-20261125 ;;
            *) echo "Unexpected preview branch"; exit 1 ;;
          esac
          test -s public/vendor/pdfjs/pdf.mjs
          test -s public/vendor/pdfjs/pdf.worker.mjs
          npx --yes wrangler@4 versions upload --config wrangler.jsonc --preview-alias "$ALIAS"
          BASE="https://$ALIAS-claude-manual.phillipstg.workers.dev"
          for asset in pdf.mjs pdf.worker.mjs; do
            verified=false
            for attempt in 1 2 3 4 5 6; do
              echo "Checking $asset (attempt $attempt)"
              rm -f /tmp/pdf-headers /tmp/pdf-asset
              if curl --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' -D /tmp/pdf-headers -o /tmp/pdf-asset "$BASE/vendor/pdfjs/$asset?verify=$GITHUB_SHA-$attempt"; then
                grep -Ei '^(HTTP/|content-type:|content-length:|cf-cache-status:)' /tmp/pdf-headers || true
                echo "Expected / received bytes:"
                wc -c "public/vendor/pdfjs/$asset" /tmp/pdf-asset
                if grep -Eq '^HTTP/[^ ]+ 200([[:space:]]|$)' /tmp/pdf-headers && grep -Eiq '^content-type: *(application|text)/(javascript|ecmascript)' /tmp/pdf-headers && cmp -s /tmp/pdf-asset "public/vendor/pdfjs/$asset"; then
                  verified=true
                  echo "Verified $asset"
                  break
                fi
              fi
              sleep 5
            done
            test "$verified" = true || { echo "::error::Preview asset verification failed: $asset"; exit 1; }
          done
