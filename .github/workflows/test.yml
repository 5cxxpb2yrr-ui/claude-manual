name: Manual Explorer Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/compact-repair-engine-integration"]

# PR-controlled code runs in this job. Validation needs read-only repository access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Tailwind build tools
        run: npm install --no-save --no-package-lock tailwindcss@4.1.17 @tailwindcss/cli@4.1.17
      - name: Compile Garage Tailwind CSS
        run: npx @tailwindcss/cli --input ./src/garage.css --output ./public/garage.css --minify
      - name: Verify generated stylesheet is committed
        run: git diff --exit-code -- public/garage.css
      - run: npm test
