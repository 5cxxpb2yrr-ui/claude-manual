	// --- tech ---
	terminal: ["M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"],
	code: ["M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"],

	server: ["M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"],
	desktop: ["M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"],
	mobile: ["M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"],

	music: ["M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"],
	film: ["M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"],

	briefcase: ["M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"],

	// --- garage / maintenance (Feather-style + simple custom) ---
	wrench: ["M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"],
	car: ["M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11", "M5 11h14a2 2 0 012 2v3a1 1 0 01-1 1h-1M5 11a2 2 0 00-2 2v3a1 1 0 001 1h1m4 0h4", "M9 17a2 2 0 11-4 0 2 2 0 014 0zm10 0a2 2 0 11-4 0 2 2 0 014 0z"],

// Helper: ICON('wrench', 'w-5 h-5') -> inline <svg> string
const ICON = (name, cls = 'w-5 h-5') =>
	`<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${(ICONS[name] || []).map(d => `<path d="${d}"/>`).join('')}</svg>`;
			function dock() {
				return {
					systemTime: "", editing: false, tiles: [], draft: null, draftIndex: -1, toast: "", icons: Object.keys(ICONS),
					init() {
						this.tiles = this.load();
						this.updateTime();
						setInterval(() => this.updateTime(), 1000);
					},
					updateTime() { this.systemTime = new Date().toTimeString().split(" ")[0]; },
					load() {
						try {
							const s = JSON.parse(localStorage.getItem("dock.tiles.v1"));
							// migrate: the Service Manuals tile used to point at "/", which is now this dock
							if (Array.isArray(s) && s.length) return s.map((t) => (t.id === "manuals" && t.url === "/" ? { ...t, url: "/manuals.html" } : t));
						} catch {}
						return JSON.parse(JSON.stringify(DEFAULTS));
					},
					save() { try { localStorage.setItem("dock.tiles.v1", JSON.stringify(this.tiles)); } catch {} },
					get linked() { return this.tiles.filter((t) => t.url).length; },
					paths(k) {
						return (ICONS[k] || ICONS.app).map((d) => `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${d}"></path>`).join("");
					},
					flash(m) { this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => (this.toast = ""), 2200); },
					resolve(u) { return u.startsWith("/") && location.protocol === "file:" ? HOME + u : u; },
					launch(t) {
						if (this.editing) return this.edit(t);
						if (!t.url) { this.flash("No link yet - add one"); return this.edit(t); }
						const u = this.resolve(t.url);
						if (t.newTab) window.open(u, "_blank", "noopener"); else location.href = u;
					},
					edit(t) { this.draftIndex = this.tiles.indexOf(t); this.draft = { ...t }; },
					add() { this.draftIndex = -1; this.draft = { id: "t" + Date.now(), name: "", sub: "", url: "", icon: "app", newTab: false }; },
					cleanUrl(u) { u = (u || "").trim(); return /^(javascript|data|vbscript):/i.test(u) ? null : u; },
					commit() {
						const d = this.draft, url = this.cleanUrl(d.url);
						if (!d.name.trim()) return this.flash("Give it a name");
						if (url === null) return this.flash("That link type isn't allowed");
						d.name = d.name.trim().toUpperCase(); d.sub = (d.sub || "").trim().toUpperCase(); d.url = url;
						if (this.draftIndex < 0) this.tiles.push(d); else this.tiles[this.draftIndex] = d;
						this.save(); this.draft = null;
					},
					remove() {
						if (this.draftIndex >= 0 && confirm("Remove this app from the dock?")) { this.tiles.splice(this.draftIndex, 1); this.save(); }
						this.draft = null;
					},
					move(i, d) {
						const j = i + d; if (j < 0 || j >= this.tiles.length) return;
						[this.tiles[i], this.tiles[j]] = [this.tiles[j], this.tiles[i]]; this.save();
					},
					reset() { if (confirm("Reset the dock to its default apps and links?")) { this.tiles = JSON.parse(JSON.stringify(DEFAULTS)); this.save(); } },
				};
			}
		</script>
	</head>

	<body
		class="h-full w-full scanline-bg flex flex-col p-4 sm:p-6 overflow-hidden select-none"
		style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom))"
		x-data="dock()"
	>
		<!-- Status header -->
		<header class="w-full max-w-md mx-auto backdrop-blur-md bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-glass">
			<div class="flex items-center space-x-3">
				<div class="relative flex h-3 w-3">
					<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
					<span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
				</div>
				<span class="text-xs font-mono tracking-widest text-slate-400 uppercase" x-text="editing ? 'SYS // EDIT MODE' : 'SYS // ONLINE'">SYS // ONLINE</span>
			</div>
			<div class="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-md tracking-wider" x-text="systemTime">00:00:00</div>
		</header>

		<!-- App tiles -->
		<main class="w-full max-w-md mx-auto flex-1 min-h-0 overflow-y-auto py-6 space-y-4">
			<template x-for="(t, i) in tiles" :key="t.id">
				<div
					role="button"
					tabindex="0"
					@click="launch(t)"
					@keydown.enter="launch(t)"
					:aria-label="t.name"
					:class="i % 2 === 0 ? 'hover:border-amber-500/60 hover:shadow-glow-amber' : 'hover:border-emerald-500/60 hover:shadow-glow-emerald'"
					class="group relative w-full h-20 rounded-2xl backdrop-blur-xl bg-slate-900/50 border border-slate-700/60 p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] overflow-hidden cursor-pointer focus:outline-none focus-visible:border-amber-500"
				>
					<div class="absolute left-0 top-0 bottom-0 w-1.5 rounded-l-2xl" :class="i % 2 === 0 ? 'bg-amber-500' : 'bg-emerald-500'"></div>
					<div class="flex items-center space-x-4 pl-3 min-w-0">
						<div
							class="p-3 rounded-xl border shrink-0 group-hover:scale-105 transition-transform"
							:class="i % 2 === 0 ? 'bg-amber-500/10 border-amber-500/20 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'"
						>
							<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-html="paths(t.icon)"></svg>
						</div>
						<div class="text-left min-w-0">
							<div class="text-base font-bold text-slate-100 tracking-wide truncate" x-text="t.name"></div>
							<div class="text-xs font-mono text-slate-400 truncate" x-text="t.sub"></div>
						</div>
					</div>

					<!-- right side: normal / unlinked / edit controls -->
					<div class="flex items-center shrink-0 ml-2">
						<template x-if="editing">
							<div class="flex items-center space-x-1" @click.stop>
								<button @click="move(i, -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 text-sm" aria-label="Move up">&uarr;</button>
								<button @click="move(i, 1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 text-sm" aria-label="Move down">&darr;</button>
							</div>
						</template>
						<template x-if="!editing && !t.url">
							<span class="text-[10px] font-mono tracking-wider text-amber-400 border border-amber-500/30 bg-amber-500/10 rounded px-1.5 py-0.5">NOT LINKED</span>
						</template>
						<template x-if="!editing && t.url">
							<svg class="w-5 h-5 text-slate-500 group-hover:text-amber-400 group-hover:translate-x-1 transition-all mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
						</template>
					</div>
				</div>
			</template>

			<div x-show="editing" x-cloak class="flex space-x-3 pt-2">
				<button @click="add()" class="flex-1 h-12 rounded-2xl border border-dashed border-emerald-500/50 text-emerald-400 font-mono text-xs tracking-widest hover:bg-emerald-500/10">+ ADD APP</button>
				<button @click="reset()" class="h-12 px-5 rounded-2xl border border-slate-700 text-slate-400 font-mono text-xs tracking-widest hover:bg-slate-800">RESET</button>
			</div>
		</main>

		<!-- Footer -->
		<footer class="w-full max-w-md mx-auto backdrop-blur-md bg-slate-900/60 border border-slate-800 rounded-2xl p-3 flex items-center justify-between text-xs font-mono text-slate-400 shadow-glass">
			<div class="flex items-center space-x-2">
				<span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
				<span>STORAGE: LOCAL • <span x-text="linked + '/' + tiles.length"></span> LINKED</span>
			</div>
			<button
				@click="editing = !editing"
				class="px-3 py-1 rounded-md border font-bold tracking-wider"
				:class="editing ? 'border-emerald-500/50 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-300'"
				x-text="editing ? 'DONE' : 'EDIT'"
			>EDIT</button>
		</footer>

		<!-- Edit / add sheet -->
		<div x-show="draft" x-cloak class="fixed inset-0 z-20 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-4" @click.self="draft = null" @keydown.escape.window="draft = null">
			<div class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-700 p-5 space-y-3 shadow-glass select-text" x-show="draft">
				<div class="text-xs font-mono tracking-widest text-amber-400" x-text="draftIndex < 0 ? 'ADD APP' : 'EDIT APP'"></div>
				<template x-if="draft">
					<div class="space-y-3">
						<label class="block text-[11px] font-mono text-slate-400 tracking-wider">NAME
							<input x-model="draft.name" type="text" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
						</label>
						<label class="block text-[11px] font-mono text-slate-400 tracking-wider">SUBTITLE
							<input x-model="draft.sub" type="text" placeholder="LOGS • TASKS • NOTES" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
						</label>
						<label class="block text-[11px] font-mono text-slate-400 tracking-wider">LINK (web address or /page.html)
							<input x-model="draft.url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://..." class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
						</label>
						<div class="flex items-center justify-between">
							<label class="text-[11px] font-mono text-slate-400 tracking-wider">ICON
								<select x-model="draft.icon" class="ml-2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100">
									<template x-for="k in icons" :key="k"><option :value="k" x-text="k.toUpperCase()"></option></template>
								</select>
							</label>
							<label class="flex items-center space-x-2 text-[11px] font-mono text-slate-400 tracking-wider">
								<input type="checkbox" x-model="draft.newTab" class="accent-amber-500 w-4 h-4" /><span>OPEN IN NEW TAB</span>
							</label>
						</div>
					</div>
				</template>
				<div class="flex space-x-2 pt-1">
					<button @click="commit()" class="flex-1 h-11 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm tracking-wide">SAVE</button>
					<button x-show="draftIndex >= 0" @click="remove()" class="h-11 px-4 rounded-xl border border-red-500/50 text-red-400 text-sm font-bold">DELETE</button>
					<button @click="draft = null" class="h-11 px-4 rounded-xl border border-slate-700 text-slate-300 text-sm">CANCEL</button>
				</div>
			</div>
		</div>

		<!-- Toast -->
		<div x-show="toast" x-cloak x-transition class="fixed bottom-24 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-xl bg-slate-800 border border-slate-600 text-xs font-mono text-slate-100 shadow-glass" x-text="toast"></div>
	</body>
</html>
