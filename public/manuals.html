<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>LifeOS Manual Explorer</title>
<style>

:root[data-theme=light]{--bg:#f2f3f5;--panel:#fff;--p2:#eceef2;--line:#d8dce3;--tx:#1b1e24;--mut:#5d6675;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}

button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.i{width:22px;height:22px;flex:none}.i.fill{fill:var(--or);stroke:var(--or)}.or{color:var(--or)}

.col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
main{flex:1;overflow:auto;padding:0 16px 20px}main.vw{padding:0;overflow:hidden}
.side{display:none;width:200px;padding:16px 8px;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.side a,.tabs a{display:flex;align-items:center;gap:12px;color:var(--mut);padding:10px 12px;border-radius:12px}.side a.on,.tabs a.on{color:var(--or);font-weight:700}.side a.on{background:var(--panel)}
.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px}body.vw .tabs{display:none}
.hd{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:14px 0 10px;background:var(--bg)}
.vw .hd{position:static;padding:12px 14px 8px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}.ib:hover{background:var(--panel)}
.ht{flex:1;min-width:0}.ht h1{margin:0;font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sb{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--mut);margin-bottom:12px}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx)}.sb .x{color:var(--mut)}
.stc{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stc b{display:block}.stc b.ok{color:var(--ok)}.stc b.bad{color:var(--or)}.stc small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.tile b{display:block;font-size:22px;line-height:1.1}.tile span{color:var(--mut);font-size:13px}.tile .i{width:30px;height:30px;color:var(--or)}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:60px}.row:hover{border-color:var(--or)}
.g{flex:1;min-width:0}.t{font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.d{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis}.t.or2{color:var(--or2)}
.cnt{background:var(--p2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}.chev{color:var(--mut);width:18px;height:18px}
.pid{font:700 12px ui-monospace,Menlo,monospace;color:var(--or)}.doc{color:var(--mut)}
.vi{width:84px;height:62px;border-radius:10px;background:var(--p2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mut)}.vi{position:relative}.vi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vi .i{width:34px;height:34px}.vi.sm{width:64px;height:48px}
.star{padding:6px;color:var(--mut)}.star.on{color:var(--or)}.star.on .i{fill:var(--or)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-weight:600}.chip.on{background:var(--or);border-color:var(--or);color:var(--ink)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qa a{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.qa .i{color:var(--tx)}

.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:1.9}.crumbs a{color:var(--or2)}
.sortb{display:flex;justify-content:space-between;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--mut);margin-bottom:12px}.sortb b{color:var(--tx);font-weight:600}
textarea.note{width:100%;min-height:200px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx)}
mark{background:#ffe14d;color:#000;border-radius:3px;padding:0 1px}.empty{padding:36px;text-align:center;color:var(--mut)}
.vwrap{display:flex;flex-direction:column;height:100%}.vsb{margin:0 14px 10px}.vsb span{font-size:13px;white-space:nowrap}.vsb button{padding:2px}
iframe.pg{flex:1;border:0;background:#fff;width:100%;min-height:0}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;color:var(--tx)}.btn.p{background:var(--or);border-color:var(--or);color:var(--ink);font-weight:700}
.foot{margin-top:22px;color:var(--mut);font-size:12px;text-align:center}
@media(min-width:900px){.side{display:flex}.tabs{display:none}.grid{grid-template-columns:repeat(3,1fr)}main{padding:0 28px 28px}}
</style></head><body>
<div class="app"><nav class="side" id="side"></nav><div class="col"><main id="main"><div class="empty">Loading manuals…</div></main></div></div>
<nav class="tabs" id="tabs"></nav>

let M,TR={},FL={},IX={},favs=LS("mx.f",[]),rec=LS("mx.r",[]),notes=LS("mx.n",{}),ST={ok:null,t:""},SORT=0,VF="All",VQ="",SQ="",SC="all";
const K=(v,g)=>v+"/"+g,url=(v,p)=>"/m/"+[v.manual,v.folder,"pages",p+".html"].map(enc).join("/");

function flat(t){const o=[],seen=new Set();(function w(n,path,ix){(n.c||[]).forEach((c,i)=>{if(c.p!==undefined){if(!seen.has(c.p)){seen.add(c.p);o.push({p:c.p,n:c.n,path,ix})}}else w(c,[...path,c.n],[...ix,i])})})(t,[],[]);return o}

const clean=s=>s.replace(/^Relays and Modules - /,"");
const MS={merged:0,skipped:0},nk=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

 const base=TR[K(vi,0)],extra=TR[K(vi,ai)],ids=new Set(FL[K(vi,0)].map(l=>l.p)),cache=new Map();
 // one pass, constant-time lookups: each folder gets a title index the first time it is touched
 (function m(b,e){let ix=cache.get(b);if(!ix){ix={leaf:new Set(),fold:new Map()};for(const x of b.c){if(x.p!==undefined)ix.leaf.add(nk(x.n));else ix.fold.set(nk(x.n),x)}cache.set(b,ix)}
  for(const c of e.c||[]){const k=nk(c.n);
   if(c.p!==undefined){if(ids.has(c.p))continue;if(ix.leaf.has(k)){MS.skipped++;continue}b.c.push(c);ix.leaf.add(k);ids.add(c.p);MS.merged++}
   else{let t=ix.fold.get(k);if(!t){t={n:c.n,c:[]};b.c.push(t);ix.fold.set(k,t)}m(t,c)}}})(base,extra);
 (function pr(n){n.c=n.c.filter(c=>{if(c.c){pr(c);return c.c.length>0}return true})})(base);
 const f=flat(base);FL[K(vi,0)]=f;IX[K(vi,0)]=new Map(f.map((x,i)=>[x.p,i]));
 v.guides.pop();delete TR[K(vi,ai)];delete FL[K(vi,ai)];delete IX[K(vi,ai)]})}
async function boot(){document.documentElement.dataset.theme=LS("mx.t","dark");
 try{const b=new URLSearchParams(location.search).get("back");if(/^https?:\/\//i.test(b||""))SV("mx.back",b)}catch{}
 try{M=await(await fetch("data/manifest.json")).json();await Promise.all(M.vehicles.flatMap((v,vi)=>v.guides.map(async(g,gi)=>{const t=await(await fetch(g.tree)).json(),k=K(vi,gi),f=flat(t);TR[k]=t;FL[k]=f;IX[k]=new Map(f.map((x,i)=>[x.p,i]))})));$("main").innerHTML='<div class="empty">Indexing manuals…</div>';await new Promise(r=>setTimeout(r,30));try{mergeAdditional()}catch(e){console.error("merge skipped",e)}}
 catch{$("main").innerHTML='<div class="empty">Could not load the page indexes.</div>';return}
 probe();route()}
async function probe(){try{const r=await fetch(url(M.vehicles[0],FL[K(0,0)][0].p),{method:"HEAD"});ST={ok:r.ok,t:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),c:r.status}}catch{ST={ok:false,t:"",c:0}}paintST()}
function paintST(){document.querySelectorAll("[data-st]").forEach(e=>{const k=e.dataset.st;e.textContent=k==="h"?(ST.ok===null?"Checking…":ST.ok?"R2 Connected":"R2 unreachable"+(ST.c?" ("+ST.c+")":"")):k==="s"?(ST.ok?"Online":ST.ok===null?"…":"Offline"):(ST.t?"Checked "+ST.t:"")});document.querySelectorAll("[data-stc]").forEach(e=>e.className=ST.ok?"ok":"bad")}
const NAV=[["/","Dock","grid"],["#/","Home","home"],["#/vehicles","Vehicles","car"],["#/search","Search","search"],["#/favs","Favorites","star"],["#/more","More","more"]];
function chrome(){const c=location.hash||"#/",h=NAV.map(([h,l,i])=>`<a href="${h}" class="${c===h||(h!=="#/"&&c.startsWith(h))?"on":""}">${I(i)}<span>${l}</span></a>`).join("");$("side").innerHTML=h;$("tabs").innerHTML=h}
const hdr=(t,s,o={})=>`<div class="hd">${o.back?`<a class="ib" href="${o.back}" aria-label="Back">${I("back")}</a>`:`<a class="ib" href="#/more" aria-label="Menu">${I("menu")}</a>`}<div class="ht"><h1>${esc(t)}</h1>${s?`<small>${esc(s)}</small>`:""}</div>${o.right||""}</div>`;

 ({"":home,vehicles:vlist,veh:()=>vehicle(m,+b,c||"man"),t:()=>tview(m,+b,+c,d),v:()=>viewer(m,+b,+c,+d),favs:()=>plist(m,"Favorites",favs),recent:()=>plist(m,"Recent Pages",rec),search:()=>{if(b)SQ=b;searchv(m)},more:more}[a||""]||home)(m);paintST()}

 if(q.length>=2){const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode()){const n=w.currentNode;if(!/^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentNode.nodeName)&&re.test(n.nodeValue))ns.push(n);re.lastIndex=0}
  for(const n of ns){if(hits.length>=500)break;const f=d.createDocumentFragment(),t=n.nodeValue;let last=0,mm;re.lastIndex=0;while((mm=re.exec(t))){f.append(t.slice(last,mm.index));const k=d.createElement("mark");k.dataset.mx=1;k.style.cssText="background:#ffe14d;color:#000";k.textContent=mm[0];f.append(k);hits.push(k);last=mm.index+mm[0].length}f.append(t.slice(last));n.parentNode.replaceChild(f,n)}}
