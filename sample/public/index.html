<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeOS Manual Explorer</title>
<style>
:root{--bg:#14171c;--panel:#1d2128;--p2:#262b34;--line:#323844;--tx:#eef0f3;--mut:#9aa3b2;--or:#ff8a1f;--or2:#ffb066;--ink:#16181d;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f4f6;--panel:#fff;--p2:#eef0f3;--line:#d9dde3;--tx:#1b1e24;--mut:#5d6675;color-scheme:light}}
:root[data-theme=light]{--bg:#f3f4f6;--panel:#fff;--p2:#eef0f3;--line:#d9dde3;--tx:#1b1e24;--mut:#5d6675;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;white-space:nowrap}.logo b{color:var(--or)}
.gs{flex:1;min-width:0;max-width:520px;margin-left:auto;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit}
.st{font-size:12px;color:var(--mut);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}.dot.ok{background:#3ccf6e}.dot.bad{background:var(--or)}
.tg{width:38px;height:38px;border-radius:10px;background:var(--p2);border:1px solid var(--line)}
.shell{flex:1;display:flex;min-height:0}
.side{width:190px;border-right:1px solid var(--line);background:var(--panel);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side a,.tabs a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut)}.side a.on,.tabs a.on{background:var(--or);color:var(--ink);font-weight:700}
.tabs{display:none}
main{flex:1;overflow:auto;padding:18px;min-width:0}
h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:20px 0 8px}.sub{color:var(--mut);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:26px;color:var(--or)}.stat span{color:var(--mut);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:58px}.row:hover{border-color:var(--or)}
.ic{width:38px;height:38px;border-radius:9px;background:var(--p2);display:grid;place-items:center;flex:none}.fold .ic{background:rgba(255,138,31,.16)}
.g{flex:1;min-width:0}.t{font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.d{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.cnt{background:var(--p2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}.chev{color:var(--mut);font-size:18px}.pid{font:600 12px ui-monospace,Menlo,monospace;color:var(--or2)}
.star{font-size:20px;color:var(--mut);padding:6px}.star.on{color:var(--or)}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:1.9}.crumbs a{color:var(--or2);padding:2px 4px}
.find{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--tx);font:inherit;margin-bottom:12px}
mark{background:#ffe14d;color:#000;border-radius:3px}.empty{padding:36px;text-align:center;color:var(--mut)}
.viewer{display:flex;flex-direction:column;height:calc(100% + 36px);margin:-18px}
.vbar,.vfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-color:var(--line);border-style:solid;border-width:0}
.vbar{border-bottom-width:1px}.vfoot{border-top-width:1px;justify-content:space-between;color:var(--mut)}.vbar .t{flex:1;-webkit-line-clamp:1}
.btn{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}.btn.p{background:var(--or);border-color:var(--or);color:var(--ink);font-weight:700}
iframe.pg{flex:1;border:0;background:#fff;width:100%}
@media(max-width:760px){.side{display:none}.st span{display:none}main{padding:14px}.viewer{height:calc(100% + 28px);margin:-14px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.tabs a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center}}
</style></head><body>
<header><div class="logo">LifeOS <b>Manual Explorer</b></div><input id="gs" class="gs" type="search" placeholder="Search all pages…" aria-label="Search all pages"><div class="st"><i class="dot" id="dot"></i><span id="stx">Connecting…</span></div><button class="tg" id="tg" aria-label="Toggle theme">◐</button></header>
<div class="shell"><nav class="side" id="side"></nav><main id="main"><div class="empty">Loading manuals…</div></main></div>
<nav class="tabs" id="tabs"></nav>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),enc=encodeURIComponent;
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let M,TR={},FL={},IX={},favs=LS("mx.f",[]),rec=LS("mx.r",[]);
const K=(v,g)=>v+"/"+g,url=(v,p)=>"/m/"+[v.manual,v.folder,"pages",p+".html"].map(enc).join("/");
const cnt=n=>n.p!==undefined?1:n.c.reduce((a,x)=>a+cnt(x),0);
function flat(t){const o=[],seen=new Set();(function w(n,path,ix){(n.c||[]).forEach((c,i)=>{if(c.p!==undefined){if(!seen.has(c.p)){seen.add(c.p);o.push({p:c.p,n:c.n,path,ix})}}else w(c,[...path,c.n],[...ix,i])})})(t,[],[]);return o}
function hl(t,q){t=esc(t);return q?t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"):t}
async function boot(){
 try{M=await(await fetch("data/manifest.json")).json();
 await Promise.all(M.vehicles.flatMap((v,vi)=>v.guides.map(async(g,gi)=>{const t=await(await fetch(g.tree)).json(),k=K(vi,gi),f=flat(t);TR[k]=t;FL[k]=f;IX[k]=new Map(f.map((x,i)=>[x.p,i]))})))}
 catch{$("main").innerHTML='<div class="empty">Could not load the page indexes.</div>';return}
 probe();route()}
async function probe(){try{const v=M.vehicles[0],r=await fetch(url(v,FL[K(0,0)][0].p),{method:"HEAD"});$("dot").className="dot "+(r.ok?"ok":"bad");$("stx").textContent=r.ok?"R2 connected":"R2 unreachable ("+r.status+")"}catch{$("dot").className="dot bad";$("stx").textContent="R2 unreachable"}}
const NAV=[["#/","Home","⌂"],["#/vehicles","Vehicles","🚗"],["#/search","Search","⌕"],["#/favs","Favorites","★"]];
function chrome(){const c=location.hash||"#/",h=NAV.map(([h,l,i])=>`<a href="${h}" class="${c===h||(h!=="#/"&&c.startsWith(h))?"on":""}"><span>${i}</span>${l}</a>`).join("");$("side").innerHTML=h;$("tabs").innerHTML=h}
function route(){if(!M)return;chrome();const [,a,vi,gi,x]=decodeURIComponent(location.hash||"#/").split("/"),m=$("main");
 if(!a)return home(m);if(a==="vehicles")return vlist(m);if(a==="veh")return vehicle(m,+vi);if(a==="t")return tview(m,+vi,+gi,x);if(a==="v")return viewer(m,+vi,+gi,+x);if(a==="favs")return favsv(m);if(a==="search")return searchv(m)}
const fk=(vi,gi,p)=>vi+"/"+gi+"/"+p,isF=k=>favs.includes(k);
function leaf(vi,gi,l,q,sub){const k=fk(vi,gi,l.p);return`<a class="row" href="#/v/${vi}/${gi}/${l.p}"><div class="ic">📄</div><div class="g"><div class="t">${hl(l.n,q)}</div><div class="d">${esc(sub||"Service page")}</div></div><button class="star ${isF(k)?"on":""}" data-fav="${k}" aria-label="Favorite">${isF(k)?"★":"☆"}</button></a>`}
function look(k){const [vi,gi,p]=k.split("/").map(Number),i=IX[K(vi,gi)]?.get(p);return i===undefined?null:{vi,gi,l:FL[K(vi,gi)][i]}}
function home(m){let pages=0;Object.values(FL).forEach(f=>pages+=f.length);const guides=M.vehicles.reduce((a,v)=>a+v.guides.length,0);
 const r=rec.map(look).filter(Boolean).slice(0,6);
 m.innerHTML=`<h1>Garage Manual Library</h1><p class="sub">Your automotive service information in one place.</p><div class="stats"><div class="stat"><b>${M.vehicles.length}</b><span>Vehicles</span></div><div class="stat"><b>${guides}</b><span>Manuals</span></div><div class="stat"><b>${pages.toLocaleString()}</b><span>Pages</span></div><div class="stat"><b>${favs.length}</b><span>Favorites</span></div></div><h2>Recent</h2><div class="list">${r.map(x=>leaf(x.vi,x.gi,x.l,"",M.vehicles[x.vi].name)).join("")||'<div class="empty">Pages you open show up here.</div>'}</div>`}
function vlist(m){m.innerHTML=`<h1>Vehicles</h1><p class="sub">${M.vehicles.length} in your library</p><div class="list">${M.vehicles.map((v,i)=>`<a class="row" href="#/veh/${i}"><div class="ic">🚗</div><div class="g"><div class="t">${esc(v.name)}</div><div class="d">${esc(v.engine)} • ${v.guides.length} manuals</div></div><span class="chev">›</span></a>`).join("")}</div>`}
function vehicle(m,vi){const v=M.vehicles[vi];m.innerHTML=`<div class="crumbs"><a href="#/vehicles">Vehicles</a> › ${esc(v.name)}</div><h1>${esc(v.name)}</h1><p class="sub">${esc(v.engine)}</p><div class="list">${v.guides.map((g,gi)=>`<a class="row fold" href="#/t/${vi}/${gi}/"><div class="ic">📁</div><div class="g"><div class="t">${esc(g.title)}</div><div class="d">${TR[K(vi,gi)].c.length} categories</div></div><span class="cnt">${FL[K(vi,gi)].length.toLocaleString()}</span><span class="chev">›</span></a>`).join("")}</div>`}
function tview(m,vi,gi,x){const v=M.vehicles[vi],t=TR[K(vi,gi)],path=x?x.split(".").map(Number):[],nodes=[t];try{for(const i of path)nodes.push(nodes.at(-1).c[i])}catch{}
 const n=nodes.at(-1),b=`#/t/${vi}/${gi}/`,up=path.length?b+path.slice(0,-1).join("."):"#/veh/"+vi;
 const cr=[`<a href="${b}">${esc(t.title)}</a>`,...path.map((_,k)=>`<a href="${b}${path.slice(0,k+1).join(".")}">${esc(nodes[k+1].n.replace(/^Relays and Modules - /,""))}</a>`)].join(" › ");
 m.innerHTML=`<div class="crumbs"><a href="${up}">‹ Back</a> • <a href="#/veh/${vi}">${esc(v.name)}</a> › ${cr}</div><h1>${esc(path.length?n.n:t.title)}</h1><p class="sub">${n.c.length} items • ${cnt(n).toLocaleString()} pages</p><input class="find" id="tf" type="search" placeholder="Filter this level…" aria-label="Filter this level"><div class="list" id="tl"></div>`;
 const draw=q=>{$("tl").innerHTML=n.c.map((c,i)=>[c,i]).filter(([c])=>!q||c.n.toLowerCase().includes(q)).map(([c,i])=>c.p!==undefined?leaf(vi,gi,c,q):`<a class="row fold" href="${b}${[...path,i].join(".")}"><div class="ic">📁</div><div class="g"><div class="t">${hl(c.n,q)}</div><div class="d">${c.c.length} items</div></div><span class="cnt">${cnt(c).toLocaleString()}</span><span class="chev">›</span></a>`).join("")||'<div class="empty">Nothing matches.</div>'};
 draw("");$("tf").oninput=e=>draw(e.target.value.trim().toLowerCase())}
function viewer(m,vi,gi,p){const v=M.vehicles[vi],f=FL[K(vi,gi)],i=IX[K(vi,gi)].get(p);if(i===undefined){m.innerHTML='<div class="empty">Page not found.</div>';return}
 const l=f[i],k=fk(vi,gi,p),u=url(v,p);rec=[k,...rec.filter(x=>x!==k)].slice(0,20);SV("mx.r",rec);
 const nv=j=>f[j]?`href="#/v/${vi}/${gi}/${f[j].p}"`:"";
 m.innerHTML=`<div class="viewer"><div class="vbar"><a class="btn" href="#/t/${vi}/${gi}/${l.ix.join(".")}" aria-label="Back to list">‹</a><div class="t">${esc(l.n)}</div><button class="star ${isF(k)?"on":""}" data-fav="${k}" aria-label="Favorite">${isF(k)?"★":"☆"}</button><a class="btn" href="${u}" target="_blank" rel="noopener">Open</a></div><iframe class="pg" src="${u}" title="${esc(l.n)}"></iframe><div class="vfoot"><a class="btn" ${nv(i-1)}>‹ Previous</a><span>Page ${i+1} of ${f.length.toLocaleString()}</span><a class="btn p" ${nv(i+1)}>Next ›</a></div></div>`}
function favsv(m){const r=favs.map(look).filter(Boolean);m.innerHTML=`<h1>Favorites</h1><div class="list" style="margin-top:14px">${r.map(x=>leaf(x.vi,x.gi,x.l,"",M.vehicles[x.vi].name)).join("")||'<div class="empty">Tap ☆ on any page to pin it here.</div>'}</div>`}
function searchv(m){const q=($("gs").value||"").trim().toLowerCase(),hits=[];
 if(q.length>=2)M.vehicles.forEach((v,vi)=>v.guides.forEach((g,gi)=>FL[K(vi,gi)].forEach(l=>{if(hits.length<200&&l.n.toLowerCase().includes(q))hits.push([vi,gi,l])})));
 m.innerHTML=`<h1>Search</h1><p class="sub">${q.length<2?"Type at least 2 letters above.":hits.length+(hits.length>=200?"+":"")+" results for “"+esc(q)+"”"}</p><div class="list">${hits.map(([vi,gi,l])=>leaf(vi,gi,l,q,M.vehicles[vi].name+" › "+l.path.join(" › ").replace(/Relays and Modules - /,""))).join("")}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-fav]");if(!b)return;e.preventDefault();e.stopPropagation();const k=b.dataset.fav;favs=isF(k)?favs.filter(x=>x!==k):[k,...favs];SV("mx.f",favs);if(!(location.hash||"").startsWith("#/v/"))route();else{b.classList.toggle("on",isF(k));b.textContent=isF(k)?"★":"☆"}},true);
$("gs").addEventListener("input",()=>{if(!(location.hash||"").startsWith("#/search"))location.hash="#/search";else route()});
$("tg").onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"))==="dark"?"light":"dark"};
addEventListener("hashchange",route);boot();
</script></body></html>
